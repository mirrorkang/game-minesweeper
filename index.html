<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="经典网页扫雷：9×9 棋盘、10 颗雷、首点安全、计时与状态提示，支持右键 / 长按插旗。" />
  <title>扫雷</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <h1 class="title">💣 扫雷</h1>
    <p class="guide">游戏说明：<span class="guide-meta">9×9 · 10 雷 · </span>首点安全 · 71 格全开获胜</p>
    <div class="toolbar">
      <span id="status" class="status idle">未开始 · 点击格子开始</span>
      <button id="restart-btn" class="restart-btn" type="button">重新开始</button>
    </div>
    <span id="announcer" class="sr-only" aria-live="polite"></span>
    <div id="board" class="board" role="group" aria-label="扫雷棋盘"></div>
    <p class="hint">左键：挖开　·　右键 / 长按：插旗 / 取消旗</p>
  </main>

  <script src="js/game.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
